name: Origin uBlock MV3
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y jq zip
      - run: bash origin/build.sh
      - run: node origin/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Origin-uBlock-chromium
          path: dist/origin/*.zip
